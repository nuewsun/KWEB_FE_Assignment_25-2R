<form action="#">
    <h4>1. 이름을 작성해주세요.</h4>
    <input type="text" />

    <h4>2. 학번을 작성해주세요.</h4>
    <input type="text" />

    <h4>3. 현재 회원 등급을 선택해주세요.</h4>
    <input type="radio" id="준회원" name="회원" value="준회원" />
    <label for="준회원">준회원</label>

    <input type="radio" id="정회원" name="회원" value="정회원" />
    <label for="정회원">정회원</label>

    <input type="radio" id="휴회원" name="회원" value="휴회원" />
    <label for="휴회원">휴회원</label>

    <h4>4. 본인이 관심있는 분야를 모두 선택해주세요.</h4>
    <input type="checkbox" id="프론트엔드" name="관심분야" value="프론트엔드" />
    <label for="프론트엔드">프론트엔드 프로그래밍</label>

    <input type="checkbox" id="백엔드" name="관심분야" value="백엔드" />
    <label for="백엔드">백엔드 프로그래밍</label>

    <input type="checkbox" id="웹 크롤링" name="관심분야" value="웹 크롤링" />
    <label for="웹 크롤링">웹 크롤링</label>

    <input type="checkbox" id="웹 보안" name="관심분야" value="웹 보안" />
    <label for="웹 보안">웹 보안</label>

    <input type="checkbox" id="기타" name="관심분야" value="기타" />
    <label for="기타">기타 <input type="text" /></label>

    <h4>5. 2020년 봄학기 KWEB 스터디에 대한 전반적인 평가와 피드백을 작성해주세요.</h4>
	<textarea id="feedback" rows="15" cols="80"></textarea>
	<br/><br/>
	<button type="submit" rows="30" cols="30">제출</button>
</form>
